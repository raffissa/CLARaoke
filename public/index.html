<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claraoke Delheartz</title><meta name="color-scheme" content="dark"><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#player">Skip to player</a>
<header class="top">
  <a class="brand" href="/" aria-label="Starlight Karaoke home"><span class="logo" aria-hidden="true">🎤</span><span>CLARaoke <b>Delheartz</b></span></a>
  <form class="search" role="search" id="searchForm" autocomplete="off">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m21 21-4.3-4.3M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
    <input id="q" type="search" placeholder="Search title, artist or genre" aria-label="Search songs" aria-controls="sugg" aria-autocomplete="list" enterkeyhint="search">
    <button type="button" id="clear" class="icon" aria-label="Clear search" hidden>✕</button>
    <ul id="sugg" class="sugg" role="listbox" hidden></ul>
  </form>
  <div id="account" class="account"></div>
</header>
<main class="layout">
  <section class="stage" aria-label="Now playing">
    <div id="player" class="player" tabindex="-1">
      <video id="video" preload="none" playsinline crossorigin="anonymous"></video>
      <button id="bigPlay" class="bigplay" aria-label="Play"><svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
      <div id="vErr" class="verr" role="alert" hidden>This video couldn't be loaded.</div>
      <div class="controls">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <div class="row">
          <button id="prev" class="icon" aria-label="Previous song">⏮</button><button id="pp" class="icon" aria-label="Play">▶</button><button id="next" class="icon" aria-label="Next song">⏭</button>
          <span id="time" class="time">0:00 / 0:00</span>
          <span class="grow"></span>
          <button id="mute" class="icon" aria-label="Mute">🔊</button>
          <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <button id="cc" class="icon" aria-label="Toggle captions" aria-pressed="false" hidden>CC</button>
          <button id="fs" class="icon" aria-label="Fullscreen">⛶</button>
        </div>
      </div>
    </div>
    <div id="info" class="info" aria-live="polite"></div>
  </section>
  <aside class="recs" aria-labelledby="recTitle">
    <div class="rechead"><h2 id="recTitle">Recommended Songs</h2><div id="genres" class="chips" role="group" aria-label="Filter by genre"></div></div>
    <div id="recScroll" class="recscroll"><ul id="list" class="list"></ul>
    <div id="empty" class="state" hidden></div>
    <div id="sentinel" aria-hidden="true"></div></div>
  </aside>
</main>
<dialog id="authDlg"><form method="dialog" id="authForm" class="modal">
  <h2 id="authTitle">Sign in</h2>
  <label>Username<input name="username" required minlength="3" autocomplete="username"></label>
  <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
  <p id="authErr" class="err" role="alert"></p>
  <div class="actions"><button type="button" class="ghost" id="authSwitch">Create account</button><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Continue</button></div>
</form></dialog>
<dialog id="songDlg"><form id="songForm" class="modal wide" novalidate>
  <h2 id="songTitleH">Add Video</h2>
  <div class="grid2">
    <label>Song title *<input name="title" required maxlength="120"></label>
    <label>Artist *<input name="artist" required maxlength="120"></label>
    <label>Category / genre *<input name="genre" required maxlength="40" list="genreList"><datalist id="genreList"></datalist></label>
    <label>Thumbnail image <small>JPG, PNG or WebP · max 5 MB</small><span class="filepick"><input class="vh" id="thumbIn" name="thumb" type="file" accept=".jpg,.jpeg,.png,.webp,image/*"><span class="pickbtn">Choose file</span><span class="fname empty" id="thumbName">No file chosen</span></span></label>
  </div>
  <label>Karaoke video * <small>MP4, WebM or OGV · max 500 MB</small><span class="filepick"><input class="vh" id="videoIn" name="video" type="file" accept=".mp4,.webm,.ogv,video/*"><span class="pickbtn">Choose file</span><span class="fname empty" id="videoName">No file chosen</span></span></label>
  <label>Captions <small>optional · .vtt</small><span class="filepick"><input class="vh" id="captionsIn" name="captions" type="file" accept=".vtt"><span class="pickbtn">Choose file</span><span class="fname empty" id="captionsName">No file chosen</span></span></label>
  <label>Description <small>optional</small><textarea name="description" rows="2" maxlength="1000"></textarea></label>
  <input type="hidden" name="duration">
    <p id="songErr" class="err" role="alert"></p>
  <div class="progress" id="prog" hidden><div id="bar"></div><span id="pct">0%</span></div>
  <div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary" id="saveBtn">Save &amp; Publish</button></div>
</form></dialog>
<dialog id="delDlg"><form method="dialog" class="modal"><h2>Delete this song?</h2><p id="delText"></p>
  <div class="actions"><button class="ghost" value="no">Cancel</button><button class="danger" value="yes">Delete</button></div></form></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script></body></html>
